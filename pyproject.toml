[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "r22p19-responsibility-steering"
version = "0.2.0"
description = "R22-P19 staged counterfactual responsibility validation"
requires-python = ">=3.8"
dependencies = ["h5py", "numpy", "PyYAML"]

[project.optional-dependencies]
robotwin-analysis = [
  "imageio",
  "imageio-ffmpeg",
  "matplotlib",
  "opencv-python-headless",
  "pandas",
  "pyarrow",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["r22p19_libero*", "stage2_robotwin*"]

[tool.pytest.ini_options]
testpaths = ["tests", "stage2_robotwin/tests"]
